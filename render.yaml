services:
  - type: web
    name: yaqeen-ai
    runtime: python
    repo: https://github.com/hadochhassan25-lgtm/yaqeen-ad-copy
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
